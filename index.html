<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#05070f" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="RUMBAI — персональный AI-командный центр: ассистент, задачи, заметки и документы на вашем устройстве." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RUMBAI" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>RUMBAI</title>
    <style>
      /* Boot screen shown until the app mounts; no external resources. */
      html,body{margin:0;background:#05070f;color:#eef1ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
      #boot{position:fixed;inset:0;display:grid;place-items:center}
      #boot span{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#8b6cff,#3d7bff 60%,#4fd8f0);box-shadow:0 0 40px rgba(139,108,255,.5)}
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Загрузка RUMBAI"><span></span></div>
    <div id="root"></div>
    <noscript>Для работы RUMBAI нужен JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
