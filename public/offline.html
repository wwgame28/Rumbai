<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070f" />
    <title>RUMBAI · нет сети</title>
    <style>
      body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#05070f;color:#eef1ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
      .mark{width:56px;height:56px;margin:0 auto 20px;border-radius:18px;background:linear-gradient(135deg,#8b6cff,#3d7bff 60%,#4fd8f0)}
      p{color:#a7b0d4;max-width:320px;line-height:1.5}
      a.btn{display:inline-grid;place-items:center;text-decoration:none;margin-top:16px;min-height:44px;padding:0 20px;border-radius:14px;border:0;background:#8b6cff;color:#fff;font:inherit;font-weight:600}
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>Нет подключения</h1>
      <p>RUMBAI ещё не успел сохранить себя для работы офлайн. Откройте приложение один раз при подключении к сети — после этого интерфейс, задачи и заметки будут доступны без интернета.</p>
      <a class="btn" href="./">Повторить</a>
    </main>
  </body>
</html>
